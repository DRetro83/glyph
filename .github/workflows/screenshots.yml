# Installs Glyph on a clean Debian 13 with ./install.sh, starts the real session
# headless and takes the README screenshots (docs/img/real/). Run it by hand
# (Actions -> screenshots -> Run workflow) or by changing extras/screenshots/.
name: screenshots

on:
  push:
    branches: [main]
    paths:
      - "extras/screenshots/**"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  take:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: A user with sudo, like a normal PC
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo git ca-certificates python3 dbus-x11 wlr-randr python3-pil
          useradd -m -s /bin/bash glyph
          echo "glyph ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/glyph
      - uses: actions/checkout@v4
      - name: Install Glyph with install.sh
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/glyph/glyph
          chown -R glyph:glyph /home/glyph/glyph
          su - glyph -c "cd ~/glyph && DEBIAN_FRONTEND=noninteractive ./install.sh" 2>&1 | tail -60
          dpkg -l labwc | tail -1
      - name: Take the screenshots
        shell: bash
        run: |
          set +e
          su - glyph -c "cd ~/glyph && bash extras/screenshots/take.sh /tmp/shots" > take.log 2>&1 || true
          tail -80 take.log
          mkdir -p shots
          cp /tmp/shots/*.png shots/
          cp take.log /tmp/shots/session.log shots/
          ls -la shots
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

  commit:
    needs: take
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Put them in docs/img/real
        run: |
          mkdir -p docs/img/real
          cp shots/real-*.png docs/img/real/ 2>/dev/null || true
          cp shots/*.log docs/img/real/ 2>/dev/null || true
          git config user.name "glyph-screenshots"
          git config user.email "glyph@users.noreply.github.com"
          git add docs/img/real
          git commit -m "Screenshots of the real Glyph session (made on GitHub)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
