# Builds labwc-glyph: Debian 13's labwc with Glyph's small titlebar patch
# (fine stripes and the boxed "■ TITLE"), tests it headless, and puts the
# .deb and a screenshot on the release "labwc-glyph".
name: labwc-glyph

on:
  push:
    paths:
      - "extras/labwc/**"
      - ".github/workflows/labwc-glyph.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates devscripts dpkg-dev quilt
      - uses: actions/checkout@v4
      - name: Debian source of labwc
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get build-dep -y labwc
          mkdir -p build && cd build
          apt-get source labwc
          ls
      - name: Apply the Glyph patch and build
        shell: bash
        run: |
          set -eo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/build.log") 2>&1
          cd build/labwc-*/
          pwd; ls debian
          mkdir -p debian/patches
          cp "$GITHUB_WORKSPACE/extras/labwc/glyph-titlebar.patch" debian/patches/
          cp "$GITHUB_WORKSPACE/extras/labwc/glyph-shadow.patch" debian/patches/
          echo glyph-titlebar.patch >> debian/patches/series
          echo glyph-shadow.patch >> debian/patches/series
          export QUILT_PATCHES=debian/patches
          quilt push -a
          quilt pop -a
          DEBEMAIL="glyph@users.noreply.github.com" DEBFULLNAME="Glyph" \
            dch -v "$(dpkg-parsechangelog -S Version)+glyph2" --distribution trixie --force-distribution \
            "Glyph: fine titlebar stripes, a boxed window title and a hard window shadow."
          dpkg-buildpackage -b -uc -us
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          echo "built $(date -u)" > out/status.txt
          cp build/labwc_*.deb out/ 2>/dev/null || true
          cp build.log out/ 2>/dev/null || true
          ls -la out
      - name: Test headless
        if: always()
        shell: bash
        run: |
          exec > >(tee out/test.log) 2>&1
          set -x
          apt-get update
          apt-get install -y --no-install-recommends ./out/labwc_*.deb grim foot python3 dbus-x11 librsvg2-common fontconfig || true
          apt-get install -y --no-install-recommends fonts-ibm-plex || apt-get install -y --no-install-recommends fonts-dejavu-core || true
          export HOME=/root XDG_RUNTIME_DIR=/tmp/xdg WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 LANG=C.UTF-8 LC_ALL=C.UTF-8
          mkdir -p $XDG_RUNTIME_DIR && chmod 700 $XDG_RUNTIME_DIR
          mkdir -p $HOME/.config/glyph/labwc
          cp config/labwc/rc.xml config/labwc/menu.xml $HOME/.config/glyph/labwc/
          python3 bin/glyph-theme --colour tan || true
          # test only: a red shadow, so the screenshot shows where it falls
          sed -i 's/^window.active.shadow.color:.*/window.active.shadow.color: #ff0000ff/; s/^window.inactive.shadow.color:.*/window.inactive.shadow.color: #ff000080/' $HOME/.local/share/themes/Glyph/labwc/themerc || true
          grep -n -i shadow $HOME/.config/glyph/labwc/rc.xml $HOME/.local/share/themes/Glyph/labwc/themerc || true
          cat $HOME/.local/share/themes/Glyph/labwc/themerc | head -40 || true
          printf 'foot -T "notes.txt - Text editor" &\nsleep 1\nfoot -T "Home - Files" &\n' > $HOME/.config/glyph/labwc/autostart
          eval $(dbus-launch --sh-syntax) || true
          labwc -C $HOME/.config/glyph/labwc > out/labwc-test.log 2>&1 &
          sleep 8
          ls $XDG_RUNTIME_DIR
          WAYLAND_DISPLAY=wayland-0 grim out/screenshot.png || true
          # does a theme change (labwc --reconfigure) close GTK apps on this labwc?
          apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-3.0 gir1.2-gtklayershell-0.1 python3-gi-cairo >/dev/null 2>&1 || true
          export WAYLAND_DISPLAY=wayland-0 PATH="$PWD/bin:$PATH" LABWC_PID=$(pgrep -x labwc)
          python3 bin/glyph-settings Appearance > out/settings-run.log 2>&1 &
          sleep 4
          echo "before: $(pgrep -af glyph-settings)" >> out/reconf.log
          python3 bin/glyph-theme --mode light >> out/reconf.log 2>&1 || true
          sleep 3
          echo "after theme: $(pgrep -af glyph-settings)" >> out/reconf.log
          labwc --reconfigure; sleep 3
          echo "after reconfigure: $(pgrep -af glyph-settings)" >> out/reconf.log
          cat /root/.cache/glyph-settings.log >> out/reconf.log 2>/dev/null || true
          grim out/screenshot2.png || true
          tail -30 out/labwc-test.log >> out/reconf.log || true
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labwc-glyph
          path: out/

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: labwc-glyph
          path: out
      - name: Publish to the release "labwc-glyph"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release view labwc-glyph >/dev/null 2>&1 || \
            gh release create labwc-glyph --prerelease --title "labwc-glyph (titlebar patch for Debian 13)" \
              --notes "labwc from Debian 13 with Glyph's titlebar patch: fine stripes and a boxed window title. Installed by install.sh. Built automatically."
          gh release upload labwc-glyph out/* --clobber
